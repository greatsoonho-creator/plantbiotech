<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="산림유전체·육종, 유실수·특용수, 품종보호·UPOV, 산림청 정책·법령의 최신 논문·기사·법령을 매일 모아 한국어로 요약합니다.">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>산림생명자원 브리핑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a reading list, not a dashboard of tiles. Fixed sidebar of filters on desktop, chips on phone;
   main column is a dated ledger of items grouped by day, newest first. */
:root{
  --bg:#f5f6f2; --surface:#ffffff; --fg:#1b221d; --muted:#5e6a62; --line:#d8ddd4; --line-soft:#e8ebe4;
  --accent:#2c5a3c; --accent-ink:#ffffff; --accent-soft:#e3ece4;
  --c-genome:#2c5a3c; --c-fruit:#9a4a22; --c-pvp:#3d4f8a; --c-policy:#8a6a1f;
  --new:#b23a3a;
  --display:"Noto Serif KR",ui-serif,Georgia,"Apple SD Gothic Neo",serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121714; --surface:#1a211c; --fg:#e4e9e2; --muted:#98a39a; --line:#2d3730; --line-soft:#232c26;
  --accent:#86bd95; --accent-ink:#0f1a13; --accent-soft:#1f2d24;
  --c-genome:#86bd95; --c-fruit:#e09a6e; --c-pvp:#9fb0ee; --c-policy:#d9b55a; --new:#ee8686; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121714; --surface:#1a211c; --fg:#e4e9e2; --muted:#98a39a; --line:#2d3730; --line-soft:#232c26;
  --accent:#86bd95; --accent-ink:#0f1a13; --accent-soft:#1f2d24;
  --c-genome:#86bd95; --c-fruit:#e09a6e; --c-pvp:#9fb0ee; --c-policy:#d9b55a; --new:#ee8686; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;margin:0}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:0 48px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:28px 18px;border-bottom:1px solid var(--line)}
.brand h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.01em;margin:0;line-height:1.2;text-wrap:balance}
.brand p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.meta b{color:var(--fg);font-weight:500}

.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:36px;padding-top:22px}
@media (max-width:820px){.layout{grid-template-columns:1fr;gap:16px}}

aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);align-self:start;display:flex;flex-direction:column;gap:22px}
@media (max-width:820px){aside{position:static}}
.flabel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
@media (min-width:821px){.chips.col{flex-direction:column;gap:2px}}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;line-height:1.3}
.chips.col .chip{border:0;background:transparent;border-radius:6px;padding:6px 8px;justify-content:space-between;width:100%}
.chips.col .chip:hover{background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips.col .chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.chip .n{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-left:auto}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.8}
.chip:focus-visible,.search input:focus-visible,.tog:focus-visible,.item a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 11px;font:inherit;font-size:14px}
.search input::placeholder{color:var(--muted)}
.tog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.tog input{accent-color:var(--accent)}

main{min-width:0}
.summary{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline;margin:0 0 18px;font-size:13.5px;color:var(--muted)}
.summary strong{font-family:var(--mono);font-weight:500;color:var(--fg);font-size:14px}
.day{margin:0 0 26px}
.day h2{font-family:var(--mono);font-weight:500;font-size:12.5px;letter-spacing:.04em;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:10px}
.day h2::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.day h2 .wd{color:var(--fg)}
.item{display:grid;grid-template-columns:4px minmax(0,1fr);gap:0 14px;background:var(--surface);border:1px solid var(--line-soft);border-radius:8px;margin:0 0 8px;overflow:hidden}
.item .stripe{background:var(--c)}
.item .body{padding:12px 16px 12px 2px;min-width:0}
.item.read{opacity:.55}
.row1{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12px;color:var(--muted);margin-bottom:4px}
.row1 .cat{color:var(--c);font-weight:700}
.pill{border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:11px;line-height:1.6;font-weight:500}
.pill.new{border-color:var(--new);color:var(--new)}
.row1 .src{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:28ch}
.item h3{font-family:var(--display);font-weight:600;font-size:16.5px;line-height:1.4;margin:0;text-wrap:balance}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.orig{font-size:12.5px;color:var(--muted);margin:3px 0 0;overflow-wrap:anywhere}
.sum{margin:8px 0 0;font-size:14px;max-width:72ch}
.tags{display:flex;flex-wrap:wrap;gap:4px 10px;margin:8px 0 0;font-family:var(--mono);font-size:11px;color:var(--muted)}
.tags span::before{content:"#"}
.rbtn{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;padding:0;margin-left:auto;text-decoration:underline;text-underline-offset:3px}
.rbtn:hover{color:var(--fg)}

.empty{border:1px dashed var(--line);border-radius:10px;padding:34px 22px;text-align:center;color:var(--muted);max-width:60ch;margin:12px auto}
.empty h2{font-family:var(--display);font-size:19px;color:var(--fg);margin:0 0 8px}
.empty p{margin:0;font-size:14px}
.note{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line-soft);margin-top:30px;padding-top:12px}
@media (prefers-reduced-motion:no-preference){.item{transition:opacity .2s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>산림생명자원 브리핑</h1>
      <p>산림유전체·육종, 유실수·특용수, 품종보호·UPOV, 산림청 정책·법령의 최신 논문·기사·법령을 매일 모아 한국어로 요약합니다.</p>
    </div>
    <div class="meta">
      <span>마지막 갱신 <b id="m-run">—</b></span>
      <span>누적 <b id="m-total">0</b>건</span>
      <span>최근 7일 <b id="m-week">0</b>건</span>
    </div>
  </header>

  <div class="layout">
    <aside>
      <div>
        <p class="flabel">주제</p>
        <div class="chips col" id="cats" role="group" aria-label="주제 필터">
          <button class="chip" aria-pressed="true" data-cat="all"><span>전체</span><span class="n" id="n-all">0</span></button>
          <button class="chip" aria-pressed="false" data-cat="genome" style="--c:var(--c-genome)"><span class="dot"></span><span>산림유전체·육종</span><span class="n" id="n-genome">0</span></button>
          <button class="chip" aria-pressed="false" data-cat="fruit" style="--c:var(--c-fruit)"><span class="dot"></span><span>유실수·특용수</span><span class="n" id="n-fruit">0</span></button>
          <button class="chip" aria-pressed="false" data-cat="pvp" style="--c:var(--c-pvp)"><span class="dot"></span><span>품종보호·UPOV</span><span class="n" id="n-pvp">0</span></button>
          <button class="chip" aria-pressed="false" data-cat="policy" style="--c:var(--c-policy)"><span class="dot"></span><span>정책·법령·보도</span><span class="n" id="n-policy">0</span></button>
        </div>
      </div>
      <div>
        <p class="flabel">자료 유형</p>
        <div class="chips" id="types" role="group" aria-label="유형 필터">
          <button class="chip" aria-pressed="true" data-type="all">전체</button>
          <button class="chip" aria-pressed="false" data-type="paper">논문</button>
          <button class="chip" aria-pressed="false" data-type="news">기사</button>
          <button class="chip" aria-pressed="false" data-type="policy">정책</button>
          <button class="chip" aria-pressed="false" data-type="law">법령</button>
          <button class="chip" aria-pressed="false" data-type="patent">특허</button>
        </div>
      </div>
      <div class="search">
        <p class="flabel">검색</p>
        <input id="q" type="search" placeholder="밤나무, Pyrus, DUS, 산지관리법 …" autocomplete="off">
      </div>
      <label class="tog"><input type="checkbox" id="hideread"> 읽은 자료 숨기기</label>
    </aside>

    <main>
      <div class="summary" id="summary" hidden></div>
      <div id="list"></div>
      <div class="empty" id="empty">
        <h2>아직 수집된 자료가 없습니다</h2>
        <p>매일 아침 자동 수집이 끝나면 이 자리에 날짜별로 쌓입니다. </p>
      </div>
      <p class="note">요약은 자동 생성된 참고용이며, 인용 전에 원문을 확인하세요. 발행일을 알 수 없는 자료는 수집일 기준으로 표시됩니다. "읽음" 표시는 이 기기에만 저장됩니다.</p>
    </main>
  </div>
</div>

<script>
(function(){
  const CAT = {genome:"산림유전체·육종", fruit:"유실수·특용수", pvp:"품종보호·UPOV", policy:"정책·법령·보도"};
  const TYPE = {paper:"논문", news:"기사", policy:"정책", law:"법령", patent:"특허"};
  const WD = ["일","월","화","수","목","금","토"];
  const state = {cat:"all", type:"all", q:"", hideRead:false, items:[], latestRun:null, latestAt:null};
  let read = new Set();
  try{ read = new Set(JSON.parse(localStorage.getItem("fb-read")||"[]")); }catch(e){}
  try{ state.hideRead = localStorage.getItem("fb-hideread")==="1"; }catch(e){}
  const $ = s => document.querySelector(s);
  $("#hideread").checked = state.hideRead;

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
  function fmtDay(k){
    const d = new Date(k+"T00:00:00");
    if (isNaN(d)) return k;
    return k + ' <span class="wd">' + WD[d.getDay()] + "</span>";
  }
  function fmtDT(iso){
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    const p = new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).format(d);
    return p.replace("T"," ");
  }
  function daysAgo(k, n){
    const t = new Date(k+"T00:00:00").getTime();
    return !isNaN(t) && (Date.now()-t) <= n*864e5;
  }

  function render(){
    const items = state.items;
    const counts = {all:items.length, genome:0, fruit:0, pvp:0, policy:0};
    items.forEach(it=>{ if(counts[it.cat]!=null) counts[it.cat]++; });
    for (const k in counts){ const el=$("#n-"+k); if(el) el.textContent = counts[k]; }
    $("#m-total").textContent = items.length;
    $("#m-week").textContent = items.filter(it=>daysAgo(it.date_key,7)).length;
    $("#m-run").textContent = state.latestAt ? fmtDT(state.latestAt) : (state.latestRun || "—");

    const q = state.q.trim().toLowerCase();
    const shown = items.filter(it=>{
      if (state.cat!=="all" && it.cat!==state.cat) return false;
      if (state.type!=="all" && it.type!==state.type) return false;
      if (state.hideRead && read.has(it.id)) return false;
      if (q){
        const hay = [it.title, it.title_ko, it.summary_ko, it.source, (it.tags||[]).join(" ")].join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    const list = $("#list"), empty = $("#empty"), sum = $("#summary");
    list.innerHTML = "";
    if (!items.length){ empty.hidden=false; sum.hidden=true; return; }
    empty.hidden = true;
    sum.hidden = false;
    const filt = state.cat!=="all" || state.type!=="all" || q || state.hideRead;
    sum.innerHTML = '<span><strong>'+shown.length+'</strong>건 표시' + (filt ? ' · 필터 적용 중' : '') + '</span>'
      + (state.latestRun ? '<span>이번 갱신에서 새로 들어온 자료는 <span class="pill new">NEW</span> 로 표시</span>' : '');

    // group by date_key desc
    const groups = new Map();
    shown.forEach(it=>{ const k = it.date_key || "0000-00-00"; if(!groups.has(k)) groups.set(k, []); groups.get(k).push(it); });
    const keys = [...groups.keys()].sort().reverse();
    const frag = document.createDocumentFragment();
    keys.forEach(k=>{
      const sec = document.createElement("section"); sec.className="day";
      sec.innerHTML = "<h2>"+fmtDay(k)+"</h2>";
      groups.get(k).forEach(it=>{
        const art = document.createElement("article");
        art.className = "item" + (read.has(it.id) ? " read" : "");
        art.style.setProperty("--c", "var(--c-"+(CAT[it.cat]?it.cat:"policy")+")");
        const isNew = state.latestRun && it.collected_at === state.latestRun;
        const showOrig = it.title && it.title_ko && it.title !== it.title_ko;
        art.innerHTML =
          '<div class="stripe"></div><div class="body">' +
          '<div class="row1"><span class="cat">'+esc(CAT[it.cat]||it.cat)+'</span>' +
          '<span class="pill">'+esc(TYPE[it.type]||it.type)+'</span>' +
          (isNew ? '<span class="pill new">NEW</span>' : '') +
          '<span class="src" title="'+esc(it.source)+'">'+esc(it.source)+'</span>' +
          '<button class="rbtn" data-id="'+esc(it.id)+'">'+(read.has(it.id)?"읽지 않음으로":"읽음 표시")+'</button></div>' +
          '<h3><a href="'+esc(it.url)+'" target="_blank" rel="noopener">'+esc(it.title_ko||it.title)+'</a></h3>' +
          (showOrig ? '<p class="orig">'+esc(it.title)+'</p>' : '') +
          '<p class="sum">'+esc(it.summary_ko)+'</p>' +
          ((it.tags||[]).length ? '<div class="tags">'+it.tags.map(t=>'<span>'+esc(t)+'</span>').join("")+'</div>' : '') +
          '</div>';
        sec.appendChild(art);
      });
      frag.appendChild(sec);
    });
    list.appendChild(frag);
  }

  // filters
  $("#cats").addEventListener("click", e=>{
    const b = e.target.closest(".chip"); if(!b) return;
    state.cat = b.dataset.cat;
    $("#cats").querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", c===b ? "true":"false"));
    render();
  });
  $("#types").addEventListener("click", e=>{
    const b = e.target.closest(".chip"); if(!b) return;
    state.type = b.dataset.type;
    $("#types").querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", c===b ? "true":"false"));
    render();
  });
  $("#q").addEventListener("input", e=>{ state.q = e.target.value; render(); });
  $("#hideread").addEventListener("change", e=>{
    state.hideRead = e.target.checked;
    try{ localStorage.setItem("fb-hideread", state.hideRead?"1":"0"); }catch(err){}
    render();
  });
  $("#list").addEventListener("click", e=>{
    const b = e.target.closest(".rbtn"); if(!b) return;
    const id = b.dataset.id;
    if (read.has(id)) read.delete(id); else read.add(id);
    try{ localStorage.setItem("fb-read", JSON.stringify([...read])); }catch(err){}
    render();
  });

  render();

  // data
  (async function(){
    try{
      const r = await fetch("data/items.json?v="+Date.now(), {cache:"no-store"});
      if(!r.ok) throw new Error(r.status);
      const d = await r.json();
      state.latestRun = d.latest_run || null;
      state.latestAt = (d.generated_at && d.generated_at.length > 10) ? d.generated_at : null;
      state.items = (d.items||[]).map(it=>Object.assign({}, it, {id: it.id || it.url}));
      render();
    }catch(e){
      console.error(e);
      $("#empty").querySelector("p").textContent = "자료를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.";
    }
  })();
})();
</script>

</body>
</html>
